[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "admissions-review-platform"
version = "0.1.0"
description = "Automates university admission eligibility review: transcript extraction, multi-agent validation, handbook-rules checking, course-catalog verification, and human-in-the-loop decisioning. Portfolio project using synthetic data only."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "google-genai>=0.3",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 115
# The real runtime constraint: only Python 3.9 is available in this dev
# environment (the Docker image uses 3.12, but local tooling/tests run on
# 3.9) — target-version=py39 stops ruff suggesting `X | None` syntax, which
# genuinely breaks at runtime on 3.9 wherever SQLAlchemy's declarative
# mapper evaluates an annotation (models.py).
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
